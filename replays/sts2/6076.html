clear('trends');for(let [key,label] of [['hp',t.hp],['gold',t.gold],['deck_count',t.deck]]){let box=el('div',undefined,'card');box.append(el('strong',label));let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 300 120');let points=cps.filter(x=>Number.isFinite(x[key])),max=Math.max(1,...points.map(x=>x[key])),path=[];points.forEach((x,i)=>{let px=points.length===1?150:10+i*280/(points.length-1),py=105-x[key]/max*90;path.push(px+','+py);let c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',px);c.setAttribute('cy',py);c.setAttribute('r','5');c.setAttribute('fill','#e9c980');let tip=document.createElementNS(svg.namespaceURI,'title');tip.textContent=x[key]+' · '+x.act+':'+x.floor;c.append(tip);c.onclick=()=>{selected=floors.indexOf((x.act||0)+':'+(x.floor||0));combat=0;index=0;stop();render()};svg.append(c)});let p=document.createElementNS(svg.namespaceURI,'polyline');p.setAttribute('points',path.join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','#8b9df2');p.setAttribute('stroke-width','2');svg.prepend(p);box.append(svg,el('small',points.length?'0 – '+max:t.none));$('trends').append(box)}
$('loss').textContent=losses.length?t.loss+': '+losses[0].v+' · '+losses[0].m?.act+':'+losses[0].m?.floor:t.loss+': '+t.none;
$('loss').onclick=()=>{if(!losses.length)return;selected=floors.indexOf((losses[0].m?.act||0)+':'+(losses[0].m?.floor||0));combat=replays.filter(x=>(x.metadata?.act||0)+':'+(x.metadata?.floor||0)===floors[selected]).findIndex(x=>x.id===losses[0].id);index=0;stop();render()};$('loss').style.cursor=losses.length?'pointer':'default';clear('detail');let fc=at(cps);if(!fc.length)line($('detail'),t.none);fc.forEach(x=>line($('detail'),t.checkpoint+': '+(x.checkpoint_id||'?')+' · '+(x.captured_at_utc||'?')+' · '+translated(x.capture_kind)+' · '+translated(x.room_type)+' · '+t.hp+' '+(x.hp??'—')+'/'+(x.max_hp??'—')+' · '+t.gold+' '+(x.gold??'—')+' · '+t.deck+' '+(x.deck_count??'—')+' · '+(x.source==='ai'||x.capture_kind==='ai_observation'?aiLabels[lang].observe:x.capture_kind==='room_completed'?labels[lang].completedHelp:x.capture_kind==='before_restore'?labels[lang].backupHelp:labels[lang].entryHelp)));
clear('choices');let ch=at(choices);if(!ch.length)line($('choices'),t.none);ch.forEach(x=>line($('choices'),[translated(x.kind),x.model_id,x.text_key,x.value,x.source,x.captured_at_utc,x.ai_reason?t.reason+': '+x.ai_reason:''].filter(Boolean).join(' · ')));clear('combats');let rs=replays.filter(x=>(x.metadata?.act||0)+':'+(x.metadata?.floor||0)===floors[selected]);rs.forEach((x,i)=>{let b=el('button',x.id+' · '+(x.metadata?.captured_at_utc||''));b.className=i===combat?'active':'';b.onclick=()=>{combat=i;index=0;stop();render()};$('combats').append(b)});let frames=rs[combat]?.snapshots?.frames||[];index=Math.min(index,Math.max(0,frames.length-1));for(let id of ['prev','play','next','speed'])$(id).disabled=!frames.length;$('position').textContent=frames.length?(index+1)+' / '+frames.length:t.none;clear('frames');if(frames.length){let f=frames[index];$('frames').append(el('h4',t.turn+' '+(f.turn??'\u2014')));for(let group of ['players','enemies']){let box=el('div',undefined,'card');box.append(el('strong',t[group]));if(!Array.isArray(f[group]))line(box,t.none);(f[group]||[]).forEach(a=>line(box,a.label+': '+t.hp+' '+(a.hp??'—')+'/'+(a.max_hp??'—')+' · '+t.block+' '+(a.block??'—')+' · '+t.intents+' '+(a.intents==null&&a.intent==null?t.none:JSON.stringify(a.intents??a.intent))));$('frames').append(box)}line($('frames'),labels[lang].hand+': '+(f.cards==null?t.none:JSON.stringify(f.cards)));line($('frames'),t.actions+': '+(f.actions==null?t.none:JSON.stringify(f.actions)));if(f.action)line($('frames'),aiLabels[lang].action+': '+f.action);if(f.ai_reason)line($('frames'),t.reason+': '+f.ai_reason);if(f.ai_reason_source)line($('frames'),aiLabels[lang].reasonSource+': '+f.ai_reason_source);if(rs[combat]?.snapshots?.format_version===1)line($('frames'),t.old)}}
$('language').onchange=e=>{lang=e.target.value;render()};$('prev').onclick=()=>{stop();index=Math.max(0,index-1);render()};$('next').onclick=()=>{stop();index++;render()};$('play').onclick=()=>{if(timer)stop();else {let rs=replays.filter(x=>(x.metadata?.act||0)+':'+(x.metadata?.floor||0)===floors[selected]),n=rs[combat]?.snapshots?.frames?.length||0;if(n&&index>=n-1)index=0;timer=setInterval(()=>{let rs=replays.filter(x=>(x.metadata?.act||0)+':'+(x.metadata?.floor||0)===floors[selected]),n=rs[combat]?.snapshots?.frames?.length||0;if(index>=n-1)stop();else index++;render()},1000/Number($('speed').value));}render()};$('speed').onchange=()=>{if(timer){stop();$('play').click()}};render();
